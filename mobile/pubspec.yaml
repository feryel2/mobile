name: carrent_client
description: "Application mobile de location de voitures - Module Gestion Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.0
  intl: ^0.20.3
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.6
  path: ^1.9.1
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
